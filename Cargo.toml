[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform/windows",
    "crates/platform/linux",
    "crates/platform/android",
    "crates/nethernet/nethernet",
    "crates/nethernet/nethernet-tokio",
    "examples/server",
    "examples/client",
]

exclude = [
    "crates/raknet",
]

[workspace.dependencies]
# Submodule / workspace crates
nethernet-tokio = { path = "crates/nethernet/nethernet-tokio" }
nethernet = { path = "crates/nethernet/nethernet" }
mineshaft-core = { path = "crates/core" }
mineshaft-windows = { path = "crates/platform/windows" }
mineshaft-linux = { path = "crates/platform/linux" }
mineshaft-android = { path = "crates/platform/android" }

# Shared external dependencies
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
bytes = "1.12.1"
socket2 = "0.6.5"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
byteorder = "1.5.0"
rand = "0.10"
futures = "0.3.34"
aes = "0.9.3"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }
http = "1"
base64 = "0.23.1"
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
rsa = { version = "0.9.10",  features = ["sha2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls-pemfile = "2"
rtc = "0.20"
ring = "0.17"
